name: Verify Zeivio
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-only-test-key-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --schema backend/prisma/schema.prisma
      - name: Apply Prisma schema to CI database
        run: npx prisma db push --skip-generate --schema backend/prisma/schema.prisma
      - name: Build backend
        run: npm run build --workspace backend
      - name: Test API and integration flows
        run: node --test backend/test/*.test.mjs
      - name: Build frontend
        run: npm run build --workspace frontend
